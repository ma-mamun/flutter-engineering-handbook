name: Content request
description: A topic the handbook should cover but does not.
title: "[content]: "
labels: ["content"]
body:
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Getting Started
        - Dart
        - Flutter Framework
        - Architecture
        - State Management
        - Data
        - Security
        - Performance
        - Testing
        - Native Integration
        - CI/CD
        - Enterprise Flutter
        - Interviews
        - New section
    validations:
      required: true

  - type: textarea
    id: topic
    attributes:
      label: Topic
      description: What should be covered?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What problem does a reader have that this would solve?
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to write this
