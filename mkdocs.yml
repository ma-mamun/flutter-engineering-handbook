site_name: Flutter Engineering Handbook
site_description: A comprehensive open-source handbook for Flutter engineers — fundamentals to enterprise architecture.
site_author: Flutter Engineering Handbook contributors
site_url: https://ma-mamun.github.io/flutter-engineering-handbook/
repo_url: https://github.com/ma-mamun/flutter-engineering-handbook
repo_name: ma-mamun/flutter-engineering-handbook
edit_uri: edit/main/docs/
copyright: Released under the MIT License

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Part 1 — Foundations:
      - part-01-foundations/index.md
      - Dart Language Essentials: part-01-foundations/dart-language-essentials.md
      - Null Safety: part-01-foundations/dart-null-safety.md
      - Async & Concurrency: part-01-foundations/dart-async.md
      - Isolates: part-01-foundations/dart-isolates.md
      - Widgets, Elements & Render Objects: part-01-foundations/flutter-three-trees.md
      - Rendering Pipeline: part-01-foundations/rendering-pipeline.md
      - Widget Lifecycle: part-01-foundations/widget-lifecycle.md
      - Constraints & Layout: part-01-foundations/constraints-and-layout.md
  - Part 2 — Professional:
      - part-02-professional/index.md
      - Project Structure: part-02-professional/project-structure.md
      - Tooling: part-02-professional/tooling.md
      - Clean Architecture: part-02-professional/clean-architecture.md
      - Dependency Injection: part-02-professional/dependency-injection.md
      - Navigation: part-02-professional/navigation.md
      - Error Handling: part-02-professional/error-handling.md
      - Choosing State Management: part-02-professional/state-management-choosing.md
      - Riverpod: part-02-professional/state-management-riverpod.md
      - BLoC: part-02-professional/state-management-bloc.md
      - Anti-patterns: part-02-professional/anti-patterns.md
      - Unit Tests: part-02-professional/testing-unit.md
      - Widget Tests: part-02-professional/testing-widget.md
      - Integration Tests: part-02-professional/testing-integration.md
      - Golden Tests: part-02-professional/testing-golden.md
  - Part 3 — Data:
      - part-03-data/index.md
      - Networking: part-03-data/networking.md
      - Offline First: part-03-data/offline-first.md
      - SQLite: part-03-data/sqlite.md
      - Drift: part-03-data/drift.md
      - Isar: part-03-data/isar.md
      - Hive: part-03-data/hive.md
  - Part 4 — Production:
      - part-04-production/index.md
      - Secure Storage: part-04-production/security-storage.md
      - Network Security: part-04-production/security-network.md
      - Obfuscation & Hardening: part-04-production/security-hardening.md
      - Rendering Performance: part-04-production/performance-rendering.md
      - Memory: part-04-production/performance-memory.md
      - Build Size: part-04-production/performance-build-size.md
      - Profiling: part-04-production/performance-profiling.md
      - Platform Channels: part-04-production/native-platform-channels.md
      - Dart FFI: part-04-production/native-ffi.md
      - Writing Plugins: part-04-production/native-plugins.md
      - GitHub Actions: part-04-production/ci-github-actions.md
      - Flavors: part-04-production/ci-flavors.md
      - Release Process: part-04-production/release-process.md
  - Part 5 — Enterprise:
      - part-05-enterprise/index.md
      - Modularization: part-05-enterprise/modularization.md
      - Team Workflow: part-05-enterprise/team-workflow.md
      - Observability: part-05-enterprise/observability.md
      - Design Systems: part-05-enterprise/design-systems.md
  - Part 6 — Interviews:
      - part-06-interviews/index.md
      - Mobile System Design: part-06-interviews/system-design.md
      - Coding Round: part-06-interviews/coding-round.md
      - Question Bank: part-06-interviews/flutter-questions.md
      - HR Round: part-06-interviews/hr-round.md
  - Reference:
      - Appendix:
          - appendix/index.md
          - Glossary: appendix/glossary.md
          - Further Reading: appendix/resources.md
          - Tooling Reference: appendix/tooling-reference.md
      - Cheatsheets:
          - cheatsheets/index.md
          - Widget Lifecycle: cheatsheets/widget-lifecycle.md
          - Testing: cheatsheets/testing.md
          - Performance Checklist: cheatsheets/performance-checklist.md
  - Project:
      - Roadmap: roadmap.md
      - Contributing: contributing.md
      - Style Guide: style-guide.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - code
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - minify:
      minify_html: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ma-mamun/flutter-engineering-handbook

exclude_docs: |
  diagrams/README.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
