name: handbook_code
description: Runnable Dart and Flutter snippets embedded into the handbook pages.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Timer-driven samples (debounce, throttle, retry backoff) are tested against
  # virtual time. Real `Future.delayed` in a test is a flake waiting to happen.
  fake_async: ^1.3.1
